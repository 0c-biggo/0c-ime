[package]
name = "zuin-tsf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "靈犀注音的 Windows TSF text service（薄殼：只接 TSF 事件，經 named pipe 與 0c-server 溝通）"

[lib]
name = "0c_tsf"
crate-type = ["cdylib"]

[dependencies]
zuin-win-common = { path = "../common" }
# 沙箱與沉浸式宿主（Windows 搜尋框）在宿主行程內畫候選窗，與 0c-ui 共用繪製。
zuin-ui = { path = "../ui" }
# 繫結版本釘住，不追新版（docs/19）。
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "=0.61.2"
# msctf.dll 的 TF_CreateCategoryMgr 不在 windows crate 的繫結裡（#157）；與 windows crate 用同一版。
windows-link = "=0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
