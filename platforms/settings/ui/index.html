<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>靈犀注音設定</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="icon.png" alt="" width="32" height="32"><span>靈犀注音</span></div>
    <div class="search" role="search">
      <label class="sr-only" for="search-input">搜尋設定</label>
      <svg class="search-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
      <input id="search-input" class="search-input" type="search" placeholder="搜尋設定" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-controls="search-results">
      <kbd id="search-key" class="search-key" aria-hidden="true">Ctrl F</kbd>
      <button type="button" id="search-clear" class="search-clear" tabindex="-1" aria-label="清除搜尋" hidden><svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"></path></svg></button>
    </div>
    <nav class="navlist" aria-label="設定頁面">
      <button type="button" class="nav" data-page="overview">總覽</button>
      <button type="button" class="nav" data-page="styles">輸入習慣</button>
      <button type="button" class="nav" data-page="mode">中英切換</button>
      <button type="button" class="nav" data-page="candidates">選字</button>
      <button type="button" class="nav" data-page="keyboard">鍵盤與符號</button>
      <button type="button" class="nav" data-page="output">輸出設定</button>
      <button type="button" class="nav" data-page="vocab" hidden>我的詞彙</button>
      <button type="button" class="nav" data-page="models">模型</button>
      <button type="button" class="nav" data-page="update">更新</button>
      <button type="button" class="nav" data-page="troubleshoot">問題排解</button>
      <button type="button" class="nav" data-page="about">關於</button>
    </nav>
  </aside>
  <main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <button type="button" id="search-back" class="search-back" hidden></button>
    <section id="page-search" class="page search-page" aria-labelledby="search-title" hidden></section>
    <section id="page-overview" class="page" hidden></section>
    <section id="page-styles" class="page" hidden></section>
    <section id="page-mode" class="page" hidden></section>
    <section id="page-candidates" class="page" hidden></section>
    <section id="page-keyboard" class="page" hidden></section>
    <section id="page-output" class="page" hidden></section>
    <section id="page-vocab" class="page" hidden></section>
    <section id="page-models" class="page" hidden></section>
    <section id="page-update" class="page" hidden></section>
    <section id="page-troubleshoot" class="page" hidden></section>
    <section id="page-about" class="page" hidden></section>
  </main>
</div>
<script src="engine-state.js"></script>
<script src="update-mode.js"></script>
<script src="vocab-text.js"></script>
<script src="vocab.js"></script>
<script src="models.js"></script>
<script src="personal-reset.js"></script>
<script src="input-styles.js"></script>
<script src="item-help.js"></script>
<script src="search.js"></script>
<script src="app.js"></script>
</body>
</html>
